name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # serve a creare la release e ad allegarci i file
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log

      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE:|Caused by|What went wrong" build.log | head -40 | \
            while IFS= read -r line; do echo "::error::${line}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: lasttime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk


      # Release pubblica: l APK con un nome fisso piu un manifesto con il numero di
      # versione. L indirizzo releases/latest/download/<file> punta sempre all ultima,
      # quindi l app puo chiedere "c e qualcosa di nuovo?" senza sapere in anticipo
      # quale sia l ultima versione.
      - name: Pubblica la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep "versionName = " app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep "versionCode = " app/build.gradle.kts | head -1 | tr -dc "0-9")
          echo "versione $VERSION_NAME ($VERSION_CODE)"

          cp app/build/outputs/apk/debug/app-debug.apk lasttime.apk
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/lasttime.apk"
          cat > latest.json <<JSON
          {"versionCode": $VERSION_CODE, "versionName": "$VERSION_NAME", "apk": "$APK_URL"}
          JSON
          cat latest.json

          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # stessa versione ricompilata: si sostituiscono i file invece di fallire.
            # --clobber si e' rivelato inaffidabile (risolve l'id dell'asset da
            # cancellare su una lista che a volte GitHub serve non aggiornata): si
            # cancella esplicitamente per nome, rileggendo la lista qui, poi si carica.
            for NAME in lasttime.apk latest.json; do
              ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$NAME\") | .id")
              if [ -n "$ID" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ID"
              fi
            done
            gh release upload "$TAG" lasttime.apk latest.json
          else
            gh release create "$TAG" lasttime.apk latest.json --title "Last Time $VERSION_NAME" --notes "APK di debug, firmato con la chiave condivisa del repo. Si installa sopra la versione precedente senza perdere i dati."
          fi