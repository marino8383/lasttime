name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # serve a creare la release e ad allegarci i file
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 serve al changelog: senza storia completa (e i tag) git log
      # fra una versione e l'altra non troverebbe niente da confrontare.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log

      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE:|Caused by|What went wrong" build.log | head -40 | \
            while IFS= read -r line; do echo "::error::${line}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: lasttime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk


      # Release pubblica: l APK con un nome fisso piu un manifesto con il numero di
      # versione. L indirizzo releases/latest/download/<file> punta sempre all ultima,
      # quindi l app puo chiedere "c e qualcosa di nuovo?" senza sapere in anticipo
      # quale sia l ultima versione.
      - name: Pubblica la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep "versionName = " app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep "versionCode = " app/build.gradle.kts | head -1 | tr -dc "0-9")
          echo "versione $VERSION_NAME ($VERSION_CODE)"
          TAG="v$VERSION_NAME"

          # Changelog: i commit da quando è cambiata l'ultima versione. Escluso ciò che
          # tocca solo .github (release, CI) — non è roba che interessa a chi aggiorna
          # l'app. Se è la primissima versione taggata non c'è un confronto: si prendono
          # gli ultimi commit e via.
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vFx "$TAG" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s' -- . ':!.github')
          else
            NOTES=$(git log -15 --no-merges --pretty=format:'- %s')
          fi
          [ -z "$NOTES" ] && NOTES="- Correzioni varie."
          echo "$NOTES"

          cp app/build/outputs/apk/debug/app-debug.apk lasttime.apk
          APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/lasttime.apk"
          jq -n --argjson versionCode "$VERSION_CODE" --arg versionName "$VERSION_NAME" \
            --arg apk "$APK_URL" --arg notes "$NOTES" \
            '{versionCode: $versionCode, versionName: $versionName, apk: $apk, notes: $notes}' \
            > latest.json
          cat latest.json

          {
            echo "APK di debug, firmato con la chiave condivisa del repo. Si installa sopra la versione precedente senza perdere i dati."
            echo
            echo "**Novità:**"
            echo "$NOTES"
          } > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            # stessa versione ricompilata: si sostituiscono i file invece di fallire.
            # --clobber si e' rivelato inaffidabile (risolve l'id dell'asset da
            # cancellare su una lista che a volte GitHub serve non aggiornata): si
            # cancella esplicitamente per nome, rileggendo la lista qui, poi si carica.
            for NAME in lasttime.apk latest.json; do
              ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$NAME\") | .id")
              if [ -n "$ID" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ID"
              fi
            done
            gh release upload "$TAG" lasttime.apk latest.json
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" lasttime.apk latest.json --title "Last Time $VERSION_NAME" --notes-file release_notes.md
          fi